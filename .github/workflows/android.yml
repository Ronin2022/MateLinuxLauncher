name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore UAT debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: matelinuxlauncher-uat-debug-keystore-v1

      - name: Verify UAT signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="108DB346F0A51443C1361F6F4C41F710306AF8E809A3DE12FD649D0BC6EA9C39"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "UAT debug keystore cache is missing; refusing to create an APK with a new signature."
            exit 1
          fi
          actual="$(LC_ALL=C keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | awk '/SHA256:/{print $2; exit}' \
            | tr -d ':')"
          if [ "$actual" != "$expected" ]; then
            echo "Signing certificate drift: expected $expected, got $actual"
            exit 1
          fi
          printf '%s\n' "$actual" > signing-certificate-sha256.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Test, lint and assemble
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MateLinuxLauncher-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-certificate-sha256.txt
          if-no-files-found: error
